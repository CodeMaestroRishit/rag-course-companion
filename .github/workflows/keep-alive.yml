name: Keep Render services alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend API
        run: |
          curl -sf "${{ secrets.RENDER_APP_URL }}/clips?limit=1" -o /dev/null \
            && echo "Backend: OK" \
            || echo "Backend: FAILED (cold-starting or down)"
      - name: Ping Chroma directly
        run: |
          curl -sf "${{ secrets.CHROMA_APP_URL }}/api/v2/heartbeat" -o /dev/null \
            && echo "Chroma: OK" \
            || echo "Chroma: FAILED (cold-starting or down)"
