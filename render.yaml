# Render Blueprint - deploy with "New +" -> "Blueprint" in the Render
# dashboard, pointing at this repo.
#
# Two services:
#   - chroma-db: Chroma's official Docker image. (Running Chroma via
#     `npx chromadb run` inside the Node service - the original approach
#     here - fails on Render's Node runtime: the `chromadb` npm package's
#     native binary requires a newer glibc than that runtime image ships.
#     The official Docker image sidesteps this entirely.)
#   - rag-course-companion: the Express API, talking to chroma-db over
#     Render's private network.
#
# chroma-db is `type: web`, not `type: pserv` (private service), because
# Render's private services have no free instance type - only a paid one.
# This means Chroma's HTTP API also gets a public `.onrender.com` URL with
# no authentication in front of it. rag-course-companion still talks to it
# over the private network (via CHROMA_HOST below), which is what actually
# matters for normal operation - but anyone who finds the public URL can
# read or wipe the ingested data. Fine for a demo; add auth (or switch this
# to `type: pserv` on a paid plan) before treating this as a real deployment.
#
# Both are on the FREE plan: no persistent disk, so Chroma's data lives on
# its container's ephemeral filesystem - wiped on every redeploy/restart, and
# (without a keep-alive pinger - see .github/workflows/keep-alive.yml) on
# 15-minutes-idle spin-down too. For data that actually persists, switch both
# services' `plan` to `starter` (or above) and add a `disk:` block to
# chroma-db mounted at /data.
services:
  - name: chroma-db
    type: web
    runtime: image
    plan: free
    image:
      url: docker.io/chromadb/chroma:latest
    envVars:
      # Render defaults to expecting the container's app on port 10000; the
      # official Chroma image hardcodes 8000 and ignores that, so this has to
      # be set explicitly or Render's private-network routing won't line up
      # with the port Chroma is actually listening on.
      - key: PORT
        value: "8000"

  - name: rag-course-companion
    type: web
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: OPENAI_API_KEY
        sync: false # you'll be prompted for this during Blueprint creation
      - key: CHROMA_HOST
        fromService:
          name: chroma-db
          property: host
      - key: CHROMA_PORT
        value: "8000"
