# Render Blueprint - deploy with "New +" -> "Blueprint" in the Render
# dashboard, pointing at this repo. Requires a paid plan (starter or above)
# because persistent disks aren't available on free web services - without
# one, Chroma's data would be wiped every time the service restarts, redeploys,
# or spins down from idling.
services:
  - name: rag-course-companion
    type: web
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: bash render-start.sh
    disk:
      name: chroma-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: OPENAI_API_KEY
        sync: false # you'll be prompted for this during Blueprint creation
      - key: CHROMA_HOST
        value: 127.0.0.1
      - key: CHROMA_PORT
        value: "8000"
      - key: CHROMA_DATA_PATH
        value: /data/chroma
